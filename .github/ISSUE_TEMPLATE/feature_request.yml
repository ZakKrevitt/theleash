name: Feature request
description: Propose a focused improvement to Leash.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need, not only the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and permissions impact
      description: Explain any new data, network access, dependency, or macOS permission this would require. Write "None" when it requires none.
    validations:
      required: true
